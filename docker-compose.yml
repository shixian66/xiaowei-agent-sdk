x-app-environment: &app-environment
  XIAOWEI_ENVIRONMENT_ID: dev
  XIAOWEI_ACTOR: local-developer
  XIAOWEI_LOG_LEVEL: INFO
  XIAOWEI_POSTGRES_HOST: postgres
  XIAOWEI_POSTGRES_PORT: "5432"
  XIAOWEI_POSTGRES_DATABASE: xiaowei
  XIAOWEI_POSTGRES_USER: xiaowei
  XIAOWEI_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  XIAOWEI_API_BIND_HOST: "0.0.0.0"
  XIAOWEI_API_BIND_PORT: "8000"

x-app-service: &app-service
  image: xiaowei-agent:m5-local
  build:
    context: .
    dockerfile: Dockerfile
  environment: *app-environment
  secrets:
    - postgres_password
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    environment:
      POSTGRES_DB: xiaowei
      POSTGRES_USER: xiaowei
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "xiaowei", "-d", "xiaowei"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *app-service
    command: ["python", "-m", "xiaowei_agent.interfaces.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-service
    command: ["python", "-m", "xiaowei_agent.interfaces.api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  worker:
    <<: *app-service
    command: ["python", "-m", "xiaowei_agent.interfaces.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

secrets:
  postgres_password:
    file: ./.secrets/postgres_password

volumes:
  postgres_data:
