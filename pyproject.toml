[build-system]
requires = ["hatchling==1.28.0"]   # 精确钉版；同时列入 dev 以进入 uv.lock 与审计集
build-backend = "hatchling.build"

[project]
name = "xiaowei-agent"
version = "0.1.0"
description = "Policy-governed workflow agent for operations"
requires-python = ">=3.11,<3.12"
# 全部为**生产**代码依赖，不是 dev 工具：
#   sqlglot     —— SQLGuard 的 AST 解析器（M3）。
#   sqlalchemy  —— TaskStore 的 Core 语句构造与连接管理（M4）。用 Core 不用 ORM：
#                  ORM 的 identity map 与 flush 时机会让"必须采纳存储层 winner"
#                  这条不变量更难断言，而并发语义正是 M4 的全部承重点。
#   asyncpg     —— SQLAlchemy 2.0 的 async PostgreSQL 驱动。
#   fastapi     —— M5 薄 HTTP gateway。
#   uvicorn     —— M5 容器内 ASGI 进程。
#   openai-agents[sqlalchemy] —— 新产品 src/xiaowei 的 Agent Loop、MCP 客户端与
#                  SQLAlchemySession（P1-A Task 1 实装核对后锁定 0.22.x）。
#   asyncmy     —— 新包 StarRocks Adapter 的 MySQL 协议驱动（P1-B Task 2）。精确钉版：Adapter 依赖
#                  其 TLS 升级、非缓冲读取与关闭行为，升级须重新核对。
#   lark-channel-sdk —— 飞书长连接与发送（P1-B Task 7）。精确钉版：入站 ack 时机、raw 事件字段、
#                  发送重试与降级行为按 1.4.0 源码核对，升级须重新核对。
#   httpx2      —— 模型 HTTP 受控 transport 与 Vertex 适配器直接使用（Vertex V1-A 显式声明）；范围与
#                  openai-agents 0.22.3 / openai 3.x 的要求一致。
#   新包另用 pydantic / sqlalchemy / asyncpg。旧包 src/xiaowei_agent 不再进入 wheel 与主命令
#   （P1-B Task 8），它专用的 alembic 移到 dev（旧测试）与 legacy（旧 Compose 镜像）。
dependencies = [
    "pydantic>=2.13,<3",
    "sqlglot>=27,<31",
    "sqlalchemy[asyncio]>=2.0.44,<2.1",
    "asyncpg>=0.30,<0.31",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "openai-agents[sqlalchemy]>=0.22.3,<0.23",
    "httpx2>=2.12,<3",
    "asyncmy==0.2.15",
    "lark-channel-sdk==1.4.0",
]

[project.scripts]
xiaowei = "xiaowei.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",   # 9.0.3 修复 PYSEC-2026-1845
    "pytest-asyncio>=1.0,<2",
    "pytest-socket>=0.8,<0.9",
    "ruff>=0.16,<0.17",
    "mypy>=1.20,<2",
    "pip-audit>=2.7,<3",
    # 构建后端同时列为 dev 依赖，使其进入 uv.lock 与 pip-audit 的可复核集合。
    "hatchling==1.28.0",
    "httpx>=0.28,<1",     # ASGITransport 契约测试；不进入运行镜像
    "PyYAML>=6,<7",       # Compose 静态契约测试；不进入运行镜像
    "alembic>=1.16,<2",   # 仅旧包 xiaowei_agent 的迁移与旧测试使用
]
# 旧 M5 Compose 镜像（legacy CI 的 compose-smoke）专用：旧包的迁移入口仍需要 alembic。
# 新产品不使用；旧源码物理清理时一并删除。
legacy = [
    "alembic>=1.16,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xiaowei"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --disable-socket --allow-unix-socket"
testpaths = ["tests"]
# 使 tests.fakes（隐式命名空间包）可被各测试文件导入；tests/ 下不加 __init__.py，
# 避免与 pytest 的 prepend 导入模式冲突。
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["security: 安全边界测试，独立 CI gate（ADR-008 D3）"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "ANN", "RUF"]
# RUF001/002/003 检测"歧义 Unicode 字符"，用于防同形字攻击。
# 本项目 docstring 与注释使用中文，全角标点会被持续误报，故关闭这三条。
# 这不放宽任何安全边界：真实的 secret/注入检查由 tests/security/ 与 secret-scan 承担。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

# lark-channel-sdk 1.4.0 没有 py.typed：只对该包关闭“缺少类型信息”报错，其值按 Any 处理；
# 本仓库代码仍按 strict 检查，SDK 返回值在 feishu.py 中显式核对类型。
[[tool.mypy.overrides]]
module = ["lark_channel.*"]
ignore_missing_imports = true
