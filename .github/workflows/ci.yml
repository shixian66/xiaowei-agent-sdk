name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.8"
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
      - run: uv sync --extra dev --frozen
      - run: python -m pytest -q --ignore=tests/sdk_core

  integration:
    name: integration
    runs-on: ubuntu-24.04
    # SDK 测试数据库与本地一致；旧数据库集成测试维持本地默认跳过行为。
    env:
      SDK_TEST_POSTGRES_URL: postgresql+asyncpg://postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.8"
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
      - run: uv sync --extra dev --frozen
      - name: Run full suite with isolated SDK PostgreSQL
        run: |
          set -euo pipefail
          project=xiaowei-sdk-test
          cleanup() {
            docker compose -p "$project" -f compose.sdk-test.yml down -v
          }
          trap cleanup EXIT
          docker compose -p "$project" -f compose.sdk-test.yml up -d --wait
          python -m pytest -q

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.8"
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
      - run: uv sync --extra dev --frozen
      - run: python -m scripts.compose_smoke

  security-gate:
    name: security-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.8"
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
      - run: uv sync --extra dev --frozen
      - run: python -m pytest -m security -q

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.8"
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
      - run: uv sync --extra dev --frozen
      - run: ruff check .

  types:
    name: types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.8"
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
      - run: uv sync --extra dev --frozen
      - run: mypy src

  deps-audit:
    name: deps-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.8"
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
      - run: uv sync --extra dev --frozen
      # 审计对象是从 uv.lock 导出的第三方依赖集（--no-emit-project 排除本项目自身，
      # 因为本项目不在 PyPI 上，--strict 下会因无法审计而恒失败）。
      - run: uv export --frozen --no-emit-project --extra dev -o requirements-audit.txt
      - run: pip-audit --strict -r requirements-audit.txt

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.0"
      # linux_x64 资产的预期 SHA256，固化在本受审文件中；
      # 不回取同一发布源的 checksums.txt，避免自证。
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum-pinned)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Self-test the scanner
        run: |
          set -uo pipefail
          tmp="$(mktemp -d)"
          printf 'aws_secret_access_key = "%s"\n' "$(head -c 30 /dev/urandom | base64 | tr -d '=+/' | head -c 40)" > "$tmp/bait.tf"
          set +e
          ./gitleaks dir --redact --no-banner "$tmp"
          rc=$?
          set -e
          # gitleaks 用 1 表示"发现泄漏"；其他非零值代表扫描器自身出错，
          # 不能当作自测成功，否则命令写错也会静默"通过"。
          if [ "$rc" -ne 1 ]; then
            echo "scanner self-test FAILED: expected exit 1 (leak found), got $rc"; exit 1
          fi
          echo "scanner self-test passed: bait detected (exit 1)"
          rm -rf "$tmp"
      - name: Allowlist narrowness self-test
        run: |
          set -uo pipefail
          # .gitleaks.toml 豁免了一个已知的伪造取值。豁免的窄度必须由机器证明：
          # 只写 paths 会整文件放行（gitleaks 对 paths/regexes 取 OR），
          # matchCondition="AND" 在 8.30 顶层 allowlist 里不生效且更宽。
          # 这里放一个随机高熵 secret，它必须仍被拦下。
          tmp="$(mktemp -d)"
          cp .gitleaks.toml "$tmp/"
          mkdir -p "$tmp/tests/security"
          printf 'y = "token=%s"\n' \
            "$(head -c 30 /dev/urandom | base64 | tr -d '=+/' | head -c 40)" \
            > "$tmp/tests/security/test_trace_event_redaction.py"
          set +e
          ./gitleaks dir --redact --no-banner "$tmp"
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "allowlist narrowness FAILED: 豁免过宽，真实 secret 未被拦下 (exit $rc)"
            exit 1
          fi
          echo "allowlist narrowness passed: 同路径下的真实 secret 仍被拦下"
          rm -rf "$tmp"
      - name: Scan full git history
        run: ./gitleaks git --log-opts="--all" --redact --no-banner .
