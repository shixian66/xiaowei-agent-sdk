name: publish-amd64

on:
  workflow_dispatch:
    inputs:
      version:
        description: 发行版本号，如 V0.1；只用于发行标题，留空时标题用代码 SHA
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: publish-amd64-main
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build, smoke-check and package the amd64 image
        env:
          XW_POSTGRES_IMAGE: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
          XW_PLATFORM: linux/amd64
          XW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$XW_VERSION" ] && ! printf '%s' "$XW_VERSION" | grep -Eq '^V[0-9]+(\.[0-9]+){1,2}$'; then
            echo "版本号须形如 V0.1 或 V0.1.2" >&2
            exit 1
          fi
          docker buildx version
          image="xiaowei:$GITHUB_SHA"
          image_file="$RUNNER_TEMP/xiaowei-image.tar"
          docker buildx build \
            --platform "$XW_PLATFORM" \
            --build-arg "XW_CODE_SHA=$GITHUB_SHA" \
            --tag "$image" \
            --provenance=false \
            --sbom=false \
            --load \
            --file Dockerfile.runtime \
            .
          docker run --rm "$image" --help >/dev/null
          docker save --output "$image_file" "$image"
          archive="$RUNNER_TEMP/xiaowei-$GITHUB_SHA-linux-amd64.tar.gz"
          python3 scripts/package_release.py \
            --output "$archive" \
            --image-archive "$image_file" \
            --postgres-image "$XW_POSTGRES_IMAGE" \
            --code-sha "$GITHUB_SHA" \
            --platform "$XW_PLATFORM"
          # 用 Docker 自身验证最终发行包里的那份镜像：删掉本地镜像，从发行包解出、按 release.json
          # 核对摘要后导入，平台与入口都须正常。
          docker image rm "$image"
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir -p "$unpacked"
          tar -xzf "$archive" -C "$unpacked" release.json xiaowei-image.tar
          expected="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["image_file_sha256"])' "$unpacked/release.json")"
          printf '%s  %s\n' "$expected" "$unpacked/xiaowei-image.tar" | sha256sum --check --strict -
          docker load --input "$unpacked/xiaowei-image.tar"
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = "$XW_PLATFORM"
          docker run --rm "$image" --help >/dev/null
          printf 'APP_IMAGE=%s\nRELEASE_ARCHIVE=%s\n' "$image" "$archive" >> "$GITHUB_ENV"

      - name: Publish the versioned release archive
        env:
          GH_TOKEN: ${{ github.token }}
          XW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="sha-$GITHUB_SHA"
          if [ -n "$XW_VERSION" ]; then
            title="Xiaowei linux/amd64 $XW_VERSION"
            # 同一版本号只对应一个提交；镜像与 Release tag 仍按代码 SHA 定位。
            used="$(gh release list --limit 1000 --json name,tagName \
              --jq ".[] | select(.name == \"$title\" and .tagName != \"$tag\") | .tagName")"
            if [ -n "$used" ]; then
              echo "版本号 $XW_VERSION 已用于另一个提交（$used），请换一个版本号" >&2
              exit 1
            fi
          else
            title="Xiaowei linux/amd64 ${GITHUB_SHA:0:12}"
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Version: ${XW_VERSION:-（未指定）}
          Source commit: $GITHUB_SHA
          Platform: linux/amd64
          Application image: $APP_IMAGE
          PostgreSQL image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes"
            gh release upload "$tag" "$RELEASE_ARCHIVE" --clobber
          else
            gh release create "$tag" "$RELEASE_ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes"
          fi
